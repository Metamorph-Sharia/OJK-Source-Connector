[project]
name = "regingest"
version = "0.1.0"
description = "Modular ingestion pipeline for regulatory documents from multiple agencies (OJK first)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
regingest = "regingest.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
