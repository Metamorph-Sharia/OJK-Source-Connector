[project]
name = "ojk-connector"
version = "0.1.0"
description = "Modular ingestion pipeline for regulatory documents from multiple agencies (OJK first)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "metamorph-contract",
]

[project.scripts]
ojk-connector = "ojk_connector.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ojk_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
metamorph-contract = { path = "../Metamorph-Knowledge-Platform/packages/metamorph-contract", editable = true }
