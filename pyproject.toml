[project]
name = "ojk-connector"
version = "0.2.0"
description = "OJK regulations from OJK's own legal database (JDIH OJK): discovery, catalogue metadata, official files and text."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "metamorph-contract",
    "metamorph-pdf-text",  # METAMORPH_PDF_ENGINE=mineru: MinerU, checked against the text layer
    "pymupdf>=1.24",
]

[project.scripts]
ojk-connector = "ojk_connector.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ojk_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
metamorph-contract = { path = "../Metamorph-Knowledge-Platform/packages/metamorph-contract", editable = true }
metamorph-pdf-text = { path = "../Metamorph-Knowledge-Platform/packages/metamorph-pdf-text", editable = true }
