# ojk-connector configuration: OJK regulations, from the sources below.
# Relative paths are resolved against this file's directory.
# Architecture: docs/plan/02-architecture.md

[pipeline]
data_dir = "../data"                                  # local store + corpus (git-ignored)
credentials_dir = "~/.config/ojk-connector/credentials"   # tokens live outside the repo
# contact = "mailto:you@example.com"                  # optional: added to the User-Agent

# --- Sources: where OJK documents come from -----------------------------------
# One table per source, primary first.

# JDIH OJK (jdih.ojk.go.id): OJK's own legal database. Primary since 2026-10-16.
# Discovery lists the whole catalogue (20 requests); catalogue entries (dates, standing, history)
# are read for every listed document; content (official files + extracted text) only for documents
# no other record holds yet.
[sources.jdih_ojk]
requests_per_second = 1.0
max_content_reads_per_run = 25     # documents whose files are downloaded and read per run
max_attempts = 3

# RegAlert: retired 2026-10-16 (our account was banned; never work around a refusal). Its 977 stored
# records, texts and lineage stay in data/ and keep exporting; only new reads stopped. The source code
# is kept so `reparse` and `auth` still work if access is ever restored:
#
# [sources.regalert]
# base_url = "https://mcp.regalert.today"
# requests_per_second = 1.0
# lookback_days = 45
# max_content_reads_per_run = 25
# max_attempts = 3
# original_text_rights = "public"
# translation_rights = "restricted"
# max_charge_usd_per_read = 0.0

# --- Monitoring: alerts, change detection, health ----------------------------
# Every run writes data/reports/latest.{json,md} and appends notifications to data/alerts.jsonl.

[monitoring]
max_hours_between_runs = 36      # `ojk-connector health` turns critical after this without a successful run
full_discovery_every_days = 7    # full re-listing: detects removed documents and source format drift
discovery_drop_threshold = 0.10  # critical when a full discovery lists 10% fewer documents than stored
fill_rate_drop_points = 20       # warning when a field is filled 20 points less often than last time
content_failure_rate = 0.2       # error when more than 20% of a run's reads fail
renotify_hours = 24              # reminder interval for alerts that stay open
status_checks_per_run = 100      # free "was it amended/replaced?" checks per source per run
entry_reads_per_run = 100        # catalogue entries (one page each, no files) per source per run
dedup_title_overlap = 0.8        # how alike two titles must be to treat records as the same document

# Notification channels (any number). Secrets come from environment variables.
# min_severity: info | warning | error | critical. "info" includes "regulation was amended" events.
#
# [[monitoring.notify]]
# type = "slack"
# webhook_url_env = "OJK_CONNECTOR_SLACK_WEBHOOK_URL"
# min_severity = "warning"
#
# [[monitoring.notify]]
# type = "email"
# smtp_host = "smtp.example.com"
# smtp_port = 587
# username_env = "OJK_CONNECTOR_SMTP_USER"
# password_env = "OJK_CONNECTOR_SMTP_PASSWORD"
# from = "ojk-connector@example.com"
# to = ["data-team@example.com"]
# min_severity = "error"
#
# [[monitoring.notify]]
# type = "webhook"              # POSTs {"source": "ojk-connector", "notifications": [...]}
# url_env = "OJK_CONNECTOR_WEBHOOK_URL"
# bearer_token_env = "OJK_CONNECTOR_WEBHOOK_TOKEN"
